<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Our London Adventure ✈️🇬🇧</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Patrick+Hand&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- FLOATING DECORATIONS -->

  <div class="puppy puppy-1">🐶</div>
  <div class="puppy puppy-2">🐾</div>
  <div class="puppy puppy-3">☁️</div>
  <div class="puppy puppy-4">🦴</div>
  <div class="puppy puppy-5">🐕</div>


  <!-- MAIN PAGE -->

  <main class="container">

    <!-- HEADER -->

    <header class="hero">

      <div class="stamp">
        🇬🇧
        <span>LONDON</span>
      </div>

      <div>

        <p class="little-title">
          ୨ৎ OUR LITTLE TRIP ༘⋆
        </p>

        <h1>
          Our London Adventure ✨
        </h1>

        <p class="subtitle">
          Nine days. Nine little envelopes.<br>
          One London story. 💙
        </p>

      </div>

      <div class="cloud">
        ☁️
      </div>

    </header>


    <!-- DIVIDER -->

    <div class="divider">
      <span>✦</span>
      <span>✉️</span>
      <span>✦</span>
    </div>


    <!-- INSTRUCTIONS -->

    <p class="instruction">
      Pick an envelope and open a little piece of our adventure ♡
    </p>


    <!-- ENVELOPES -->

    <section class="envelope-grid">


      <!-- DAY 1 - SATURDAY -->

      <button class="envelope" onclick="openEnvelope(1)">

        <div class="envelope-top">

          <span class="day-number">
            01
          </span>

          <span class="mini-stamp">
            ✈️
          </span>

        </div>

        <div class="envelope-flap">
          ♡
        </div>

        <div class="envelope-label">

          <strong>
            Saturday
          </strong>

          <small>
            Aug 22 • Arrival
          </small>

        </div>

        <div class="seal">
          💙
        </div>

      </button>


      <!-- DAY 2 - SUNDAY FLEXIBLE -->

      <button class="envelope flexible" onclick="openEnvelope(2)">

        <div class="envelope-top">

          <span class="day-number">
            02
          </span>

          <span class="mini-stamp">
            ☀️
          </span>

        </div>

        <div class="envelope-flap">
          ♡
        </div>

        <div class="envelope-label">

          <strong>
            Sunday
          </strong>

          <small>
            Aug 23 • Flexible ☁️
          </small>

        </div>

        <div class="seal">
          ?
        </div>

      </button>


      <!-- DAY 3 - MONDAY -->

      <button class="envelope" onclick="openEnvelope(3)">

        <div class="envelope-top">

          <span class="day-number">
            03
          </span>

          <span class="mini-stamp">
            🎮
          </span>

        </div>

        <div class="envelope-flap">
          ♡
        </div>

        <div class="envelope-label">

          <strong>
            Monday
          </strong>

          <small>
            Aug 24 • City Lights
          </small>

        </div>

        <div class="seal">
          💙
        </div>

      </button>


      <!-- DAY 4 - TUESDAY -->

      <button class="envelope" onclick="openEnvelope(4)">

        <div class="envelope-top">

          <span class="day-number">
            04
          </span>

          <span class="mini-stamp">
            🛍️
          </span>

        </div>

        <div class="envelope-flap">
          ♡
        </div>

        <div class="envelope-label">

          <strong>
            Tuesday
          </strong>

          <small>
            Aug 25 • Markets
          </small>

        </div>

        <div class="seal">
          💙
        </div>

      </button>


      <!-- DAY 5 - WEDNESDAY -->

      <button class="envelope" onclick="openEnvelope(5)">

        <div class="envelope-top">

          <span class="day-number">
            05
          </span>

          <span class="mini-stamp">
            🏠
          </span>

        </div>

        <div class="envelope-flap">
          ♡
        </div>

        <div class="envelope-label">

          <strong>
            Wednesday
          </strong>

          <small>
            Aug 26 • Relax Day
          </small>

        </div>

        <div class="seal">
          💙
        </div>

      </button>


      <!-- DAY 6 - THURSDAY FLEXIBLE -->

      <button class="envelope flexible" onclick="openEnvelope(6)">

        <div class="envelope-top">

          <span class="day-number">
            06
          </span>

          <span class="mini-stamp">
            ☁️
          </span>

        </div>

        <div class="envelope-flap">
          ♡
        </div>

        <div class="envelope-label">

          <strong>
            Thursday
          </strong>

          <small>
            Aug 27 • Flexible ☁️
          </small>

        </div>

        <div class="seal">
          ?
        </div>

      </button>


      <!-- DAY 7 - FRIDAY -->

      <button class="envelope" onclick="openEnvelope(7)">

        <div class="envelope-top">

          <span class="day-number">
            07
          </span>

          <span class="mini-stamp">
            🛍️
          </span>

        </div>

        <div class="envelope-flap">
          ♡
        </div>

        <div class="envelope-label">

          <strong>
            Friday
          </strong>

          <small>
            Aug 28 • London Views
          </small>

        </div>

        <div class="seal">
          💙
        </div>

      </button>


      <!-- DAY 8 - SATURDAY -->

      <button class="envelope" onclick="openEnvelope(8)">

        <div class="envelope-top">

          <span class="day-number">
            08
          </span>

          <span class="mini-stamp">
            ☕
          </span>

        </div>

        <div class="envelope-flap">
          ♡
        </div>

        <div class="envelope-label">

          <strong>
            Saturday
          </strong>

          <small>
            Aug 29 • Goodbye London
          </small>

        </div>

        <div class="seal">
          💙
        </div>

      </button>


      <!-- DAY 9 - SUNDAY / FLY HOME -->

      <button class="envelope farewell" onclick="openEnvelope(9)">

        <div class="envelope-top">

          <span class="day-number">
            09
          </span>

          <span class="mini-stamp">
            ✈️
          </span>

        </div>

        <div class="envelope-flap">
          ♡
        </div>

        <div class="envelope-label">

          <strong>
            Sunday
          </strong>

          <small>
            Aug 30 • Fly Home ✈️
          </small>

        </div>

        <div class="seal">
          ✈️
        </div>

      </button>


    </section>


    <!-- BOTTOM NOTE -->

    <div class="bottom-note">

      <span>
        🐶
      </span>

      <p>
        Made with a little bit of London magic
      </p>

      <span>
        ♡
      </span>

    </div>


    <!-- START BUTTON -->

    <button class="start-button" onclick="startAdventure()">
      Start Adventure 💙
    </button>

  </main>


  <!-- POP-UP -->

  <div class="modal" id="dayModal">

    <div class="modal-card">

      <button
        class="close-button"
        onclick="closeEnvelope()"
        aria-label="Close"
      >
        ×
      </button>


      <div class="modal-stamp" id="modalEmoji">
        ✈️
      </div>


      <p class="modal-day" id="modalDay">
        SATURDAY • AUGUST 22
      </p>


      <h2 id="modalTitle">
        Arrival Day
      </h2>


      <div class="paper-line"></div>


      <div class="plans" id="modalPlans"></div>


      <p class="little-note" id="modalNote"></p>


      <div class="modal-footer">
        ✦ London memories ✦
      </div>

    </div>

  </div>


  <!-- JAVASCRIPT -->

  <script>

    const days = {


      /* DAY 1 */

      1: {

        emoji: "✈️",

        day: "SATURDAY • AUGUST 22",

        title: "Arrival Day",

        plans: [
          "✈️ Airport pickup",
          "🏠 Air B&B",
          "🛒 Grocery shopping",
          "🌆 Evening walk"
        ],

        note:
          "The beginning of our little London story ♡"

      },


      /* DAY 2 - SUNDAY FLEXIBLE */

      2: {

        emoji: "☀️",

        day: "SUNDAY • AUGUST 23",

        title: "Flexible Day",

        plans: [
          "☁️ Baby lunch with friends!",
          "♡ Decide together",
          "🌷 Evening dinner with baby and her friends"
        ],

        note:
          "A completely open day — we can decide what feels right when we get there."

      },


      /* DAY 3 */

      3: {

        emoji: "🎮",

        day: "MONDAY • AUGUST 24",

        title: "City Lights",

        plans: [
          "🎮 Arcades",
          "🛍️ Shopping",
          "✨ Cafe and out all day"
        ],

        note:
          "A day for games, exploring and staying out a little late."

      },


      /* DAY 4 */

      4: {

        emoji: "🛍️",

        day: "TUESDAY • AUGUST 25",

        title: "Markets & Riverside",

        plans: [
          "🛍️ Markets",
          "🏠 Home",
          "🌊 Riverside walk"
        ],

        note:
          "A slower London day with markets and a little riverside wandering."

      },


      /* DAY 5 */

      5: {

        emoji: "🏠",

        day: "WEDNESDAY • AUGUST 26",

        title: "Relax Day",

        plans: [
          "🏠 Home / cook at home",
          "😊 To decide",
          "🧸 Relax day"
        ],

        note:
          "Sometimes the best adventure is simply having nowhere else to be."

      },


      /* DAY 6 - THURSDAY FLEXIBLE */

      6: {

        emoji: "☁️",

        day: "THURSDAY • AUGUST 27",

        title: "Flexible Day",

        plans: [
          "☁️ Baby with her friends",
          "♡ Decide together",
          "🇬🇧 Solo adventure while baby is occupied
        ],

        note:
          "Keep this day open. We can choose our own adventure when the day arrives."

      },


      /* DAY 7 */

      7: {

        emoji: "🛍️",

        day: "FRIDAY • AUGUST 28",

        title: "London Views",

        plans: [
          "🛍️ Shopping in OXFORDDDDDD",
          "🌆 Views",
          "🌙 Late walks/Dnner out"
        ],

        note:
          "One more day to make some very good memories."

      },


      /* DAY 8 */

      8: {

        emoji: "☕",

        day: "SATURDAY • AUGUST 29",

        title: "Goodbye London",

        plans: [
          "☕ Final café",
          "📸 Memories",
          "🇬🇧 Evening time together"
        ],

        note:
          "The final little chapter of our London adventure ♡"

      },


      /* DAY 9 - FLY HOME */

      9: {

        emoji: "✈️",

        day: "SUNDAY • AUGUST 30",

        title: "Until Next Time ♡",

        plans: [
          "🧳 Pack up",
          "✈️ Flight home",
          "📸 One last look at London",
          "💙 Until our next adventure"
        ],

        note:
          "The adventure only started, more memories to come with us. ♡"

      }

    };


    /* OPEN ENVELOPE */

    function openEnvelope(dayNumber) {

      const day = days[dayNumber];

      document.getElementById("modalEmoji").textContent =
        day.emoji;

      document.getElementById("modalDay").textContent =
        day.day;

      document.getElementById("modalTitle").textContent =
        day.title;

      document.getElementById("modalNote").textContent =
        day.note;


      const plansContainer =
        document.getElementById("modalPlans");


      plansContainer.innerHTML = "";


      day.plans.forEach(function(plan) {

        const item =
          document.createElement("div");

        item.className = "plan";

        item.textContent = plan;

        plansContainer.appendChild(item);

      });


      document
        .getElementById("dayModal")
        .classList.add("show");


      document.body.classList.add("modal-open");

    }


    /* CLOSE ENVELOPE */

    function closeEnvelope() {

      document
        .getElementById("dayModal")
        .classList.remove("show");

      document.body.classList.remove("modal-open");

    }


    /* START BUTTON */

    function startAdventure() {

      document
        .querySelector(".envelope")
        .scrollIntoView({
          behavior: "smooth",
          block: "center"
        });

    }


    /* CLICK OUTSIDE TO CLOSE */

    document
      .getElementById("dayModal")
      .addEventListener("click", function(event) {

        if (event.target === this) {

          closeEnvelope();

        }

      });


    /* ESCAPE TO CLOSE */

    document.addEventListener("keydown", function(event) {

      if (event.key === "Escape") {

        closeEnvelope();

      }

    });

  </script>

</body>
</html>
